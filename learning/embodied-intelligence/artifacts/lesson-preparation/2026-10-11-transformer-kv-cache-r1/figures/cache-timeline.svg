<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545"><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17212b}.title{font-size:24px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.blue{fill:#d9ecff;stroke:#438bca}.green{fill:#ddf4df;stroke:#559265}.orange{fill:#fff0cf;stroke:#c69331}.gray{fill:#f0f3f6;stroke:#9aa7b3}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#547184"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="44" class="title">Cache 时间线：预测 token 与写入 KV 是两个时刻</text><text x="36" y="78" class="body">两层均缓存各自 K/V；行数按“已被模型处理的 token 位置”增长</text><text x="36" y="130" class="body">Prefill</text><rect x="155" y="104" width="48" height="40" rx="5" class="blue"/><text x="173" y="130" class="body">0</text><rect x="212" y="104" width="48" height="40" rx="5" class="blue"/><text x="230" y="130" class="body">1</text><rect x="269" y="104" width="48" height="40" rx="5" class="blue"/><text x="287" y="130" class="body">2</text><text x="490" y="122" class="small">最后一行 logits → 预测位置 3 的 token</text><text x="490" y="149" class="small">此刻位置 3 尚未进入 cache</text><text x="36" y="240" class="body">Decode 1</text><rect x="155" y="214" width="48" height="40" rx="5" class="blue"/><text x="173" y="240" class="body">0</text><rect x="212" y="214" width="48" height="40" rx="5" class="blue"/><text x="230" y="240" class="body">1</text><rect x="269" y="214" width="48" height="40" rx="5" class="blue"/><text x="287" y="240" class="body">2</text><rect x="326" y="214" width="48" height="40" rx="5" class="green"/><text x="344" y="240" class="body">3</text><text x="490" y="232" class="small">把位置 3 的 token 输入模型并追加其 KV</text><text x="490" y="259" class="small">这次 logits → 预测位置 4</text><text x="36" y="350" class="body">Chunk分支</text><rect x="155" y="324" width="48" height="40" rx="5" class="blue"/><text x="173" y="350" class="body">0</text><rect x="212" y="324" width="48" height="40" rx="5" class="blue"/><text x="230" y="350" class="body">1</text><rect x="269" y="324" width="48" height="40" rx="5" class="blue"/><text x="287" y="350" class="body">2</text><rect x="326" y="324" width="48" height="40" rx="5" class="green"/><text x="344" y="350" class="body">3</text><rect x="383" y="324" width="48" height="40" rx="5" class="green"/><text x="401" y="350" class="body">4</text><text x="490" y="342" class="small">一次处理位置 3、4：Q 长度 2，K/V 长度 5</text><text x="490" y="369" class="small">mask：第 3 行可见 0…3；第 4 行可见 0…4</text><text x="490" y="392" class="small">从 Prefill 长度 3 另起，不承接 Decode 1</text><text x="36" y="446" class="body">已有 cache 长度 3 的 chunk mask（1 = 可见；0 = 屏蔽）</text><text x="110" y="480" class="body">query 位置 3 → [1, 1, 1, 1, 0]</text><text x="110" y="515" class="body">query 位置 4 → [1, 1, 1, 1, 1]</text></svg>