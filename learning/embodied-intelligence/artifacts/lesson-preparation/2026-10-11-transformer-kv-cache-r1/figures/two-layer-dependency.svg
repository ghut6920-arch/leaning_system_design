<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575"><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17212b}.title{font-size:24px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.blue{fill:#d9ecff;stroke:#438bca}.green{fill:#ddf4df;stroke:#559265}.orange{fill:#fff0cf;stroke:#c69331}.gray{fill:#f0f3f6;stroke:#9aa7b3}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#547184"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="44" class="title">两层因果依赖：第 2 层 KV 已携带前缀上下文</text><text x="36" y="78" class="body">每个位置的 LayerNorm / FFN 独立按行；attention 只向前看</text><text x="36" y="175" class="body">Embedding + 绝对位置</text><rect x="270" y="150" width="95" height="52" rx="5" class="gray"/><text x="295" y="182" class="body">位置 0</text><rect x="430" y="150" width="95" height="52" rx="5" class="gray"/><text x="455" y="182" class="body">位置 1</text><rect x="590" y="150" width="95" height="52" rx="5" class="gray"/><text x="615" y="182" class="body">位置 2</text><rect x="750" y="150" width="95" height="52" rx="5" class="gray"/><text x="775" y="182" class="body">位置 3</text><text x="36" y="295" class="body">第 1 层后 h¹</text><rect x="270" y="270" width="95" height="52" rx="5" class="blue"/><text x="295" y="302" class="body">位置 0</text><rect x="430" y="270" width="95" height="52" rx="5" class="blue"/><text x="455" y="302" class="body">位置 1</text><rect x="590" y="270" width="95" height="52" rx="5" class="blue"/><text x="615" y="302" class="body">位置 2</text><rect x="750" y="270" width="95" height="52" rx="5" class="blue"/><text x="775" y="302" class="body">位置 3</text><text x="36" y="415" class="body">第 2 层后 h²</text><rect x="270" y="390" width="95" height="52" rx="5" class="green"/><text x="295" y="422" class="body">位置 0</text><rect x="430" y="390" width="95" height="52" rx="5" class="green"/><text x="455" y="422" class="body">位置 1</text><rect x="590" y="390" width="95" height="52" rx="5" class="green"/><text x="615" y="422" class="body">位置 2</text><rect x="750" y="390" width="95" height="52" rx="5" class="green"/><text x="775" y="422" class="body">位置 3</text><path d="M318,202 L318,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M318,202 L478,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M478,202 L478,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M318,202 L638,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M478,202 L638,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M638,202 L638,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M318,202 L798,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M478,202 L798,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M638,202 L798,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M798,202 L798,270" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M318,322 L318,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M318,322 L478,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M478,322 L478,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M318,322 L638,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M478,322 L638,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M638,322 L638,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M318,322 L798,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M478,322 L798,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M638,322 L798,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><path d="M798,322 L798,390" stroke="#b8c8d4" stroke-width="1.1" fill="none" marker-end="url(#arrow)"/><text x="36" y="478" class="body">第 1 层 K/V：投影当前 token 的输入状态；第 2 层 K/V：投影 h¹</text><text x="36" y="514" class="body">改动较早 token 后，后面位置的第 2 层 KV 通常需要重算。</text><text x="36" y="549" class="small">原前缀未变时，追加未来 token 不改变旧位置状态；每层旧 KV 可复用。</text></svg>