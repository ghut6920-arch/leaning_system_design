<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535"><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17212b}.title{font-size:24px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.blue{fill:#d9ecff;stroke:#438bca}.green{fill:#ddf4df;stroke:#559265}.orange{fill:#fff0cf;stroke:#c69331}.gray{fill:#f0f3f6;stroke:#9aa7b3}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#547184"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="44" class="title">逻辑 KV 容量：L=32，B=1，T=32768，dₕ=128，FP16</text><text x="36" y="83" class="body">M = 2 × L × B × T × Hkv × dₕ × 2 bytes（只计 K/V 元素）</text><text x="36" y="172" class="body">MHA：Hkv = 32</text><rect x="260" y="145" width="560.0" height="44" rx="4" class="blue"/><text x="832.0" y="173" class="body">16 GiB</text><text x="36" y="262" class="body">GQA：Hkv = 8</text><rect x="260" y="235" width="140.0" height="44" rx="4" class="green"/><text x="412.0" y="263" class="body">4 GiB</text><text x="36" y="352" class="body">MQA：Hkv = 1</text><rect x="260" y="325" width="17.5" height="44" rx="4" class="orange"/><text x="289.5" y="353" class="body">0.5 GiB</text><text x="36" y="435" class="body">同一 GQA 配置：T=65536 且 B=2 → 16 GiB</text><text x="36" y="472" class="small">此图不是性能基准：未计参数、激活、allocator、padding、页/元数据、量化尺度。</text><text x="36" y="505" class="small">Hq 决定 query/attention 头数；公式的缓存头数使用 Hkv。</text></svg>